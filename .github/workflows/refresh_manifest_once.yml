name: Finalize v0.3 manifest (one-time)

on:
  push:
    paths:
      - ".github/workflows/refresh_manifest_once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary workflow and regenerate manifest
        run: |
          git rm .github/workflows/refresh_manifest_once.yml
          python scripts/regenerate_manifest.py
      - name: Verify baseline and follow-up assessments
        run: |
          python scripts/validate_project.py
          python scripts/validate_phase2.py
          python scripts/validate_phase3.py
          python scripts/validate_workbook.py
          python scripts/validate_manifest.py
          python -m unittest discover -s tests -v
      - name: Commit updated project manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v0.3 source manifest after verified fictional audit phase"
          git push origin HEAD:main
