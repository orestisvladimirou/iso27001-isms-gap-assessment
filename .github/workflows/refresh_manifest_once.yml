name: Refresh verified ISMS manifest once
on:
  push:
    paths:
      - ".github/workflows/refresh_manifest_once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exclude temporary workflow from final manifest
        run: git rm .github/workflows/refresh_manifest_once.yml
      - name: Generate v0.3 source integrity manifest
        run: python scripts/regenerate_manifest.py
      - name: Verify base data and provisional SoA
        run: |
          python scripts/validate_project.py
          python scripts/validate_phase2.py
          python scripts/validate_phase3.py
      - name: Verify both workbooks and final file manifest
        run: |
          python scripts/validate_workbook.py
          python scripts/validate_manifest.py
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Commit validated manifest and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MANIFEST.json
          git commit -m "Refresh validated v0.3 manifest and retire import helper"
          git push origin HEAD:main
